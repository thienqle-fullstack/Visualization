<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Music Sight Reading Trainer</title>

<!-- Music font -->
<link href="https://cdn.jsdelivr.net/npm/@fontsource/bravura@latest/index.css" rel="stylesheet">

<style>
  body {
    font-family: Arial;
    text-align: center;
    background: #f4f4f4;
  }

  #stopwatch {
    position: fixed;
    top: 10px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 24px;
    font-weight: bold;
  }

  canvas {
    background: white;
    border: 1px solid #ccc;
    margin-top: 80px;
  }

  input {
    margin-top: 15px;
    font-size: 18px;
    padding: 8px;
    width: 120px;
    text-align: center;
  }

  #result {
    margin-top: 10px;
    font-size: 18px;
  }
</style>
</head>
<body>

<div id="stopwatch">0.00s</div>

<div>
  <label><input type="radio" name="mode" value="both" checked> Both</label>
  <label><input type="radio" name="mode" value="treble"> Treble</label>
  <label><input type="radio" name="mode" value="bass"> Bass</label>
</div>

<canvas id="canvas" width="520" height="240"></canvas>

<br>
<input id="answer" placeholder="Enter note (A–G)">
<div id="result"></div>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

// ===== CONFIG =====
const lineSpacing = 16;
const staffTop = 100;
const staffLeft = 70;
const staffWidth = 380;

const noteOrder = ["C","D","E","F","G","A","B"];

let currentNote, currentClef;
let startTime, timer;

// ===== TIMER =====
function startTimer() {
  startTime = Date.now();
  timer = setInterval(() => {
    const t = (Date.now() - startTime) / 1000;
    document.getElementById("stopwatch").textContent = t.toFixed(2) + "s";
  }, 10);
}

function resetTimer() {
  clearInterval(timer);
  startTimer();
}

// ===== STAFF =====
function drawStaff() {
  ctx.lineWidth = 2;

  for (let i = 0; i < 5; i++) {
    const y = staffTop + i * lineSpacing;
    ctx.beginPath();
    ctx.moveTo(staffLeft, y);
    ctx.lineTo(staffLeft + staffWidth, y);
    ctx.stroke();
  }
}

// ===== POSITION =====
function getY(step) {
  const bottomLine = staffTop + 4 * lineSpacing;
  return bottomLine - step * (lineSpacing / 2);
}

// ===== NOTE NAME =====
function noteNameFromStep(step, clef) {
  const baseIndex = clef === "treble" ? 2 : 4; // E or G
  let index = (baseIndex + step) % 7;
  if (index < 0) index += 7;
  return noteOrder[index];
}

// ===== LEDGER LINES =====
function drawLedgerLines(x, step) {
  ctx.lineWidth = 2;

  if (step < 0) {
    for (let s = step; s <= 0; s += 2) {
      const y = getY(s);
      ctx.beginPath();
      ctx.moveTo(x - 12, y);
      ctx.lineTo(x + 12, y);
      ctx.stroke();
    }
  }

  if (step > 8) {
    for (let s = 8; s <= step; s += 2) {
      const y = getY(s);
      ctx.beginPath();
      ctx.moveTo(x - 12, y);
      ctx.lineTo(x + 12, y);
      ctx.stroke();
    }
  }
}

// ===== DRAW NOTE =====
function drawNote(step) {
  const x = staffLeft + 220;
  const y = getY(step);

  drawLedgerLines(x, step);

  ctx.beginPath();
  ctx.arc(x, y, 7, 0, Math.PI * 2);
  ctx.fill();
}

// ===== CLEF =====
function drawClef() {
  ctx.font = "60px Bravura";
  const symbol = currentClef === "treble" ? "𝄞" : "𝄢";
  ctx.fillText(symbol, staffLeft, staffTop + 40);

  ctx.font = "16px Arial";
  const label = currentClef === "treble" ? "Treble Clef" : "Bass Clef";
  ctx.fillText(label, staffLeft + 60, staffTop - 20);
}

// ===== MAIN DRAW =====
function drawAll() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  drawStaff();
  drawClef();
  drawNote(currentNote.step);
}

// ===== LOGIC =====
function getMode() {
  return document.querySelector('input[name="mode"]:checked').value;
}

function nextNote() {
  const mode = getMode();

  currentClef = mode === "both"
    ? (Math.random() > 0.5 ? "treble" : "bass")
    : mode;

  const step = Math.floor(Math.random() * 21) - 6; // -6 to +14
  currentNote = {
    step,
    name: noteNameFromStep(step, currentClef)
  };

  drawAll();

  document.getElementById("answer").value = "";
  document.getElementById("result").textContent = "";

  resetTimer();
}

// ===== INPUT =====
document.getElementById("answer").addEventListener("keydown", e => {
  if (e.key === "Enter") {
    clearInterval(timer);

    const ans = e.target.value.trim().toUpperCase();

    if (ans === currentNote.name) {
      document.getElementById("result").textContent = "Correct!";
    } else {
      document.getElementById("result").textContent =
        "Wrong! It was " + currentNote.name;
    }

    setTimeout(nextNote, 800);
  }
});

document.querySelectorAll('input[name="mode"]').forEach(r => {
  r.addEventListener("change", nextNote);
});

// ===== START (wait for font) =====
document.fonts.ready.then(() => {
  startTimer();
  nextNote();
});
</script>

</body>
</html>
