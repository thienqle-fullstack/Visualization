<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Music Note Trainer</title>
<link href="https://cdn.jsdelivr.net/npm/@fontsource/bravura@latest/index.css" rel="stylesheet">
<style>
  body {
    font-family: Arial;
    text-align: center;
    background: #f4f4f4;
  }

  #stopwatch {
    position: fixed;
    top: 10px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 24px;
    font-weight: bold;
  }

  canvas {
    background: white;
    border: 1px solid #ccc;
    margin-top: 80px;
  }

  input {
    margin-top: 15px;
    font-size: 18px;
    padding: 8px;
    width: 120px;
    text-align: center;
  }

  #result {
    margin-top: 10px;
    font-size: 18px;
  }
</style>
</head>
<body>

<div id="stopwatch">0.00s</div>
<br/>
<div>
  <label><input type="radio" name="mode" value="both" checked> Both</label>
  <label><input type="radio" name="mode" value="treble"> Treble</label>
  <label><input type="radio" name="mode" value="bass"> Bass</label>
</div>

<canvas id="canvas" width="500" height="220"></canvas>

<br>
<input id="answer" placeholder="Enter note">
<div id="result"></div>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

// ===== CONFIG =====
const lineSpacing = 16;
const staffTop = 80;
const staffLeft = 60;
const staffWidth = 380;

// ===== NOTE MAPS (steps) =====
const trebleMap = [
  {name:"E", step:0},
  {name:"F", step:1},
  {name:"G", step:2},
  {name:"A", step:3},
  {name:"B", step:4},
  {name:"C", step:5},
  {name:"D", step:6},
  {name:"E", step:7},
  {name:"F", step:8}
];

const bassMap = [
  {name:"G", step:0},
  {name:"A", step:1},
  {name:"B", step:2},
  {name:"C", step:3},
  {name:"D", step:4},
  {name:"E", step:5},
  {name:"F", step:6},
  {name:"G", step:7},
  {name:"A", step:8}
];

let currentNote, currentClef;

// ===== TIMER =====
let startTime, timer;

function startTimer() {
  startTime = Date.now();
  timer = setInterval(() => {
    const t = (Date.now() - startTime) / 1000;
    document.getElementById("stopwatch").textContent = t.toFixed(2) + "s";
  }, 10);
}

function resetTimer() {
  clearInterval(timer);
  startTimer();
}

// ===== DRAWING =====
function drawStaff() {
  ctx.lineWidth = 2;

  for (let i = 0; i < 5; i++) {
    const y = staffTop + i * lineSpacing;
    ctx.beginPath();
    ctx.moveTo(staffLeft, y);
    ctx.lineTo(staffLeft + staffWidth, y);
    ctx.stroke();
  }
}

function getY(step) {
  const bottomLine = staffTop + 4 * lineSpacing;
  return bottomLine - step * (lineSpacing / 2);
}

function drawNote(step) {
  const x = staffLeft + 200;
  const y = getY(step);

  ctx.beginPath();
  ctx.arc(x, y, 7, 0, Math.PI * 2);
  ctx.fill();
}

function drawClef() {
  ctx.font = "60px Bravura";

  const symbol = currentClef === "treble" ? "𝄞" : "𝄢";
  ctx.fillText(symbol, 65, staffTop + 45);

  ctx.font = "16px Arial";
  const label = currentClef === "treble" ? "Treble Clef" : "Bass Clef";
  ctx.fillText(label, 130, staffTop - 20);
}

function drawAll() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  drawStaff();
  drawClef();
  drawNote(currentNote.step);
}

// ===== LOGIC =====
function getMode() {
  return document.querySelector('input[name="mode"]:checked').value;
}

function nextNote() {
  const mode = getMode();

  currentClef = mode === "both"
    ? (Math.random() > 0.5 ? "treble" : "bass")
    : mode;

  const map = currentClef === "treble" ? trebleMap : bassMap;
  currentNote = map[Math.floor(Math.random() * map.length)];

  drawAll();

  document.getElementById("answer").value = "";
  document.getElementById("result").textContent = "";

  resetTimer();
}

// ===== INPUT =====
document.getElementById("answer").addEventListener("keydown", e => {
  if (e.key === "Enter") {
    clearInterval(timer);

    const ans = e.target.value.trim().toUpperCase();

    if (ans === currentNote.name) {
      document.getElementById("result").textContent = "Correct!";
    } else {
      document.getElementById("result").textContent =
        "Wrong! It was " + currentNote.name;
    }

    setTimeout(nextNote, 800);
  }
});

document.querySelectorAll('input[name="mode"]').forEach(r => {
  r.addEventListener("change", nextNote);
});

// ===== START =====
startTimer();
nextNote();
</script>

</body>
</html>
